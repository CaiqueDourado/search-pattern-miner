name: Python

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install ./python[test]

      - name: Test (golden values shared with .NET)
        run: python -m pytest python/tests -q

      - name: Command line
        run: search-pattern-miner mine examples/keywords.csv --gazetteer data/gazetteer-pt.tsv --algorithms barbosa

      - name: Reproduce the published patterns (legacy2019 mode)
        run: python evaluation/reproduce.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build python --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
